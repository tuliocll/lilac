# Builds do app de bandeja para Windows, macOS e Linux quando uma tag v* é criada.
# O tinyjs só compila para o sistema em que roda, por isso a matriz.
# Os builds saem SEM assinatura (Windows SmartScreen e Gatekeeper do macOS vão reclamar);
# para assinar, configure TINYJS_SIGN_IDENTITY e o perfil do notarytool nos secrets.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    env:
      TINYJS_HOME: ${{ github.workspace }}/.tinyjs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependências do webview (Linux)
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0

      # O instalador do tinyjs consulta a API do GitHub sem token, e os runners compartilhados
      # estouram o limite de 60 req/h por IP. Aqui o token do job vai SÓ para api.github.com
      # (uma função `curl` na frente do script); os outros endereços seguem sem token.
      - name: Instala o tinyjs (macOS/Linux)
        if: matrix.name != 'windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL --retry 3 https://tinyjs.app/install -o tinyjs-install.sh
          echo "::group::instalador do tinyjs"; cat tinyjs-install.sh; echo "::endgroup::"
          {
            echo 'curl() { case "$*" in *api.github.com*) command curl -H "Authorization: Bearer $GH_TOKEN" "$@" ;; *) command curl "$@" ;; esac; }'
            cat tinyjs-install.sh
          } > tinyjs-install-auth.sh
          GH_TOKEN="$GH_TOKEN" sh tinyjs-install-auth.sh
          echo "$TINYJS_HOME" >> "$GITHUB_PATH"
          echo "$TINYJS_HOME/bin" >> "$GITHUB_PATH"

      # Mesma história no Windows: nas linhas do instalador que chamam a API do GitHub,
      # "Authorization" é juntado aos cabeçalhos que já existem (a linha já passa -Headers).
      - name: Instala o tinyjs (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $script = Invoke-RestMethod https://tinyjs.app/install.ps1 -MaximumRetryCount 3
          Write-Host "::group::instalador do tinyjs"; Write-Host $script; Write-Host "::endgroup::"
          $auth = 'Authorization = "Bearer $env:GH_TOKEN"'
          $lines = foreach ($line in $script -split "`r?`n") {
            if ($line -match 'Invoke-RestMethod' -and $line -match 'api\.github\.com') {
              if ($line -match '-Headers\s+@\{') { $line -replace '-Headers\s+@\{', ('-Headers @{ ' + $auth + '; ') }
              elseif ($line -match '-Headers\s+(\$[\w:]+)') { $line -replace '-Headers\s+(\$[\w:]+)', ('-Headers ($1 + @{ ' + $auth + ' })') }
              else { $line -replace 'Invoke-RestMethod', ('Invoke-RestMethod -Headers @{ ' + $auth + ' }') }
            } else { $line }
          }
          $script = $lines -join "`n"
          Write-Host "linhas autenticadas:"; ($lines | Where-Object { $_ -match 'Authorization' }) | ForEach-Object { Write-Host "  $_" }
          Invoke-Expression $script
          "$env:TINYJS_HOME" | Out-File -FilePath $env:GITHUB_PATH -Append
          "$env:TINYJS_HOME\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - run: npm ci
      - run: npm test

      - name: Build
        working-directory: apps/menubar
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "macos" ]; then tinyjs build --universal --dmg; else tinyjs build; fi

      - name: Empacota
        working-directory: apps/menubar
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          case "${{ matrix.name }}" in
            macos)   cp dist/*.dmg "../../Lilac-$VERSION-macos.dmg" ;;
            windows) (cd dist && 7z a "../../../Lilac-$VERSION-windows.zip" . -x!*.dmg) ;;
            linux)   tar -czf "../../Lilac-$VERSION-linux-x86_64.tar.gz" -C dist . ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: lilac-${{ matrix.name }}
          path: Lilac-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publica a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --title "Lilac $GITHUB_REF_NAME" --generate-notes --prerelease
