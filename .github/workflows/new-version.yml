# Botão para soltar uma versão: Actions → "Nova versão" → Run workflow.
# Calcula a próxima tag a partir da última (patch, minor ou major), cria a tag
# e dispara o release.yml nela. Tag criada com o token do Actions não dispara
# o evento "push" de outro workflow, por isso o release vai por workflow_dispatch.
name: Nova versão

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Que número sobe (1.2.3 → patch 1.2.4, minor 1.3.0, major 2.0.0)
        type: choice
        options: [patch, minor, major]
        default: patch
      notes:
        description: Notas do aviso no app (vazio = os últimos commits)
        required: false

permissions:
  contents: write # criar a tag
  actions: write # disparar o release.yml

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cria a tag e dispara o release
        env:
          BUMP: ${{ inputs.bump }}
          NOTES: ${{ inputs.notes }}
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          IFS=. read -r MAJOR MINOR PATCH <<< "${LAST:-v0.0.0}"
          MAJOR=${MAJOR#v}
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            *) PATCH=$((PATCH + 1)) ;;
          esac
          TAG="v$MAJOR.$MINOR.$PATCH"
          echo "${LAST:-nenhuma} → $TAG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # tag anotada com mensagem = notas do aviso; sem notas, o release usa os commits
          if [ -n "$NOTES" ]; then git tag -a "$TAG" -m "$NOTES"; else git tag "$TAG"; fi
          git push origin "$TAG"
          gh workflow run release.yml --ref "$TAG"
          echo "### $TAG criada — acompanhe o workflow Release" >> "$GITHUB_STEP_SUMMARY"
